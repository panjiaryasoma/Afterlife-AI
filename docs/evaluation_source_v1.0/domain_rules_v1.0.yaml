- rule_id: OBJECTIVE-RULE-001
  rule_class: OBJECTIVE
  stage: GLOBAL_OPTIMIZER
  severity: POLICY
  title: Objective changes selection but never hard constraints
  condition: Optimizer receives a valid objective.
  decision: Choose among feasible candidates using objective-specific formula; hard constraints remain identical. BALANCED
    requires explicit rescue floor.
  required_data:
  - optimization_objective
  - rescue_floor
  - expected_net_recovery
  - expected_physical_rescue
  - tradeoff_amount
  known_exceptions: []
