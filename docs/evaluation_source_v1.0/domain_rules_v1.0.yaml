- rule_id: EXPIRY-RULE-001
  rule_class: EXPIRY
  stage: SAFETY_GATE
  severity: HARD_REJECT
  title: Expired stock is blocked from all consumption actions
  condition: expiry_date < analysis_date.
  decision: Set EXPIRED/HARD_REJECT and block all human-consumption actions regardless of value, demand, or visual condition.
  required_data:
  - analysis_date
  - expiry_status
  - supplier_recall_policy_status
  - inventory_loss
  known_exceptions:
  - Verified supplier recall, replacement, or non-consumption return.
  model_override_allowed: false
  source_cases:
  - EVAL-024
  source_references:
  - Incident-003
  confidence: EVAL_LOCKED
  status: FINAL_DRAFT
  version: 1.0.0
- rule_id: STORAGE-RULE-002
  rule_class: STORAGE_CAPACITY
  stage: GLOBAL_OPTIMIZER
  severity: CONSTRAINT
  title: Shared cold capacity follows storage priority
  condition: Multiple lots/actions compete for limited cold storage.
  decision: Allocate first to safety-critical, then quality-critical, then optional chilled value by marginal gain; never
    use reserved capacity.
  required_data:
  - available_cold_capacity
  - storage_requirement_mode
  - marginal_value_per_capacity_unit
  - capacity_shortfall
  known_exceptions: []
  model_override_allowed: false
  source_cases:
  - EVAL-025
  source_references:
  - Incident-006
  - Incident-008
  confidence: EVAL_LOCKED
  status: FINAL_DRAFT
  version: 1.0.0
- rule_id: TRANSFER-RULE-001
  rule_class: BRANCH_TRANSFER
  stage: FEASIBILITY_AND_VALUE
  severity: SELECTION
  title: Branch transfer requires compatible demand, capacity, timing, and positive net gain
  condition: BRANCH_TRANSFER is proposed.
  decision: Allow only when destination compatibility, active demand, capacity, storage, deadline, and net gain over local
    fallback are satisfied; report as future recovery.
  required_data:
  - destination_branch_demand
  - transfer_cost
  - future_branch_recovery
  - marginal_gain_vs_local
  known_exceptions: []
