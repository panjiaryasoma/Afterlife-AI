- rule_id: CAPABILITY-RULE-002
  rule_class: CAPABILITY
  stage: FEASIBILITY_GATE
  severity: CONSTRAINT
  title: Repurpose quantity is bounded by the minimum resource
  condition: INTERNAL_REPURPOSE is feasible in principle.
  decision: max_repurpose_quantity = min(equipment_capacity, labor_capacity, ingredient_capacity, repurpose_demand).
  required_data:
  - equipment_capacity
  - labor_capacity
  - ingredient_capacity
  - repurpose_demand
  - binding_resource
