- rule_id: TRIAGE-RULE-004
  rule_class: TRIAGE
  stage: INVENTORY_TRIAGE
  title: Insufficient lot or sales evidence requires review
  condition: Surplus quantity cannot be calculated reliably because sales data, batch separation, expiry, or required category
    data is missing.
  required_data:
