- rule_id: VERIFICATION-RULE-001
  rule_class: VERIFICATION
  stage: VERIFICATION_GATE
  severity: BLOCKING
  title: Unknown required storage history blocks automatic consumption allocation
  condition: Product is storage-sensitive and required storage history cannot be verified.
  decision: Set safety status UNVERIFIED, defer model/optimizer, and require bounded human review; unresolved status blocks
    consumption.
  required_data:
  - storage_history_status
  - temperature_log_available
  - possible_excursion
  - safety_clearance_status
  known_exceptions:
  - Non-storage-sensitive categories with intact condition may use lower verification burden.
  model_override_allowed: false
  source_cases:
  - EVAL-023
  source_references:
  - External_Incident_001-016_Indonesia(1).md
  confidence: EVAL_LOCKED
  status: FINAL_DRAFT
