- rule_id: TRIAGE-RULE-005
  rule_class: TRIAGE
  stage: INVENTORY_TRIAGE
  title: Quantity conservation protects normal stock
  condition: Any inventory lot is triaged.
  required_data:
  - current_quantity
  - protected_normal_stock_quantity
  - planning_quantity
  decision: 0 <= planning_quantity <= current_quantity and protected_normal_stock_quantity + planning_quantity + expired_quantity
    + review_quantity = current_quantity, subject to mutually exclusive routing.
