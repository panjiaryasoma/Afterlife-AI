- rule_id: DONATION-RULE-002
  rule_class: DONATION
  stage: FEASIBILITY_AND_FALLBACK
  severity: BLOCKING
  title: No verified recipient or timely pickup means no automatic donation
  condition: No partner simultaneously has active verified need and feasible completion.
  decision: Return NO_FEASIBLE_DONATION_PARTNER, use bounded human reverification, then trigger safe fallback at cutoff.
  required_data:
  - active_recipient_need_quantity
  - available_capacity
  - total_donation_completion_time
