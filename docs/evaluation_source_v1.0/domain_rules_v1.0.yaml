- rule_id: QUALITY-RULE-002
  rule_class: QUALITY
  stage: SAFETY_GATE
  severity: CLASSIFICATION
  title: Separate cosmetic, ambiguous, and safety-critical defects
  condition: A product or package defect is present.
  decision: COSMETIC_ONLY may proceed with disclosure after inspection; AMBIGUOUS requires review; SAFETY_CRITICAL is hard
    reject.
  required_data:
  - defect_type
  - defect_affects_primary_barrier
  - traceability_readable
  - condition_disclosure_required
  known_exceptions: []
