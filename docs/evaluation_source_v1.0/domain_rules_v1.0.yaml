  rule_class: BUNDLE
  stage: FEASIBILITY_GATE
  severity: CONSTRAINT
  title: Bundle quantity is bounded by allocatable companion stock
  condition: BUNDLE is proposed.
  decision: Bound by companion stock minus reserved quantity, bundle ratio, demand, and execution capacity.
  required_data:
  - companion_stock
  - reserved_companion_stock
  - bundle_ratio
