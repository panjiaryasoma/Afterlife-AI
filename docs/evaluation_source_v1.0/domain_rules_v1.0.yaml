  status: FINAL_DRAFT
  version: 1.0.0
- rule_id: PIPELINE-RULE-001
  rule_class: PIPELINE
  stage: END_TO_END
  severity: ARCHITECTURAL
  title: Enforce deterministic decision order and value-type separation
  condition: A rescue planning request is processed.
  decision: Validate → route statuses → generate → gate → score feasible only → optimize globally → fallback → explain → human
    approval.
  required_data:
  - eligible_rescue_denominator
  - status_routing
  - global_budget
  - value_type
  - rejection_explanation
  - rescue_floor_status
  known_exceptions: []
  model_override_allowed: false
  source_cases:
