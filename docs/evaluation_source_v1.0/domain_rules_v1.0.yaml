  stage: FEASIBILITY_GATE
  severity: BLOCKING
  title: Wholesale MOQ aggregation requires approved compatibility group
  condition: WHOLESALE quantity is below MOQ for a single lot.
  decision: Aggregate only when partner policy and domain rule allow the compatibility group; total must meet MOQ and capacity.
  required_data:
