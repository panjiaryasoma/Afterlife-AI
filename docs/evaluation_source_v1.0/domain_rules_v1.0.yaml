  - Incident_001-016_Family_Corroborated(1).txt
  confidence: EVAL_LOCKED
  status: FINAL_DRAFT
  version: 1.0.0
pre_planner_triage_rules:
- rule_id: TRIAGE-RULE-001
  rule_class: TRIAGE
  stage: INVENTORY_TRIAGE
  title: Expired inventory bypasses rescue planner
  condition: expiry_date is present and expiry_date < analysis_date.
  required_data:
  - expiry_date
  - analysis_date
  decision: inventory_status=EXPIRED; planning_quantity=0; route to recall/non-consumption return or safe disposal.
  severity: HARD_REJECT
  model_override_allowed: false
  source_cases:
  - EVAL-024
  - EVAL-030
  source_references:
  - SCHEMA_EVALUATION_DAN_DATA_v0.3.md
  confidence: DESIGN_DECISION
  status: DRAFT_REQUIRES_TRIAGE_EVAL
  version: 1.0.0
  known_exceptions:
  - Verified recall/non-consumption return.
- rule_id: TRIAGE-RULE-002
  rule_class: TRIAGE
  stage: INVENTORY_TRIAGE
  title: User-declared surplus is bounded by current stock
  condition: declared_surplus=true.
  required_data:
  - current_quantity
  - declared_surplus_quantity
  decision: planning_quantity=declared_surplus_quantity only when 0 <= declared_surplus_quantity <= current_quantity; otherwise
    validation failure.
  severity: BLOCKING
  model_override_allowed: false
  source_cases: []
  source_references:
  - SCHEMA_EVALUATION_DAN_DATA_v0.3.md
  confidence: DESIGN_DECISION
  status: DRAFT_REQUIRES_TRIAGE_EVAL
  version: 1.0.0
  known_exceptions: []
- rule_id: TRIAGE-RULE-003
  rule_class: TRIAGE
  stage: INVENTORY_TRIAGE
  title: Calculated surplus protects expected normal stock
  condition: Sales observation and effective sales window are available.
  required_data:
  - current_quantity
  - units_sold_observation_window
  - observation_days
  - effective_sales_window_days
  - safety_stock
  decision: surplus_candidate_quantity=max(0,current_quantity-(average_daily_sales*effective_sales_window_days+safety_stock)).
  severity: CONSTRAINT
  model_override_allowed: false
  source_cases: []
  source_references:
  - SCHEMA_EVALUATION_DAN_DATA_v0.3.md
  confidence: DESIGN_DECISION
  status: DRAFT_REQUIRES_TRIAGE_EVAL
  version: 1.0.0
  known_exceptions:
