rulebook_name: Afterlife AI Domain Rulebook
version: 1.0.0
status: FINAL_DRAFT
principles:
- Hard safety, validation, coverage, verification, feasibility, capacity, and budget constraints cannot be overridden by the
  model.
- The model scores only candidates that have already passed deterministic gates.
- Every rule must be traceable to at least one evaluation case, incident, expert annotation, or explicit schema decision.
- Synthetic parameters validate logic and consistency, not real-world outcome probability.
planner_rules:
- rule_id: VALIDATION-RULE-000
  rule_class: VALIDATION
  stage: VALIDATION
  severity: BLOCKING
  title: Abstain on critical missing fields
  condition: Any safety-critical or allocation-critical required field is missing or invalid.
  decision: Set validation_status=FAILED, automatic allocation=0, model_scoring=BLOCKED, and require human review.
  required_data:
  - critical_field_completeness
  - missing_field_list
  - validation_status
  known_exceptions: []
  model_override_allowed: false
  source_cases:
  - EVAL-001
  source_references:
  - Incident-001
  - Incident_001-016_Family_Corroborated(1).txt
  confidence: EVAL_LOCKED
  status: FINAL_DRAFT
  version: 1.0.0
- rule_id: CAPABILITY-RULE-001
  rule_class: CAPABILITY
  stage: FEASIBILITY_GATE
  severity: BLOCKING
  title: Internal repurpose requires verified operational capacity and demand
  condition: INTERNAL_REPURPOSE is proposed.
  decision: Feasible quantity is bounded by verified equipment, labor, ingredient, execution, and repurpose demand capacity.
  required_data:
  - repurpose_equipment_capacity
  - labor_capacity
  - ingredient_capacity
  - repurpose_demand
  - expected_yield
  known_exceptions: []
  model_override_allowed: false
  source_cases:
  - EVAL-002
  source_references:
  - Incident-001
  - Incident-004
  confidence: EVAL_LOCKED
  status: FINAL_DRAFT
  version: 1.0.0
- rule_id: TIMING-RULE-001
  rule_class: TIMING
  stage: FEASIBILITY_GATE
  severity: BLOCKING
  title: Completion must fit binding safety or commercial window
  condition: A candidate action has a binding safe or commercial deadline.
  decision: Reject candidate when estimated completion exceeds the earliest binding deadline.
  required_data:
  - estimated_completion_hours
  - safe_window_hours
  - pickup_window
  - distribution_time
  - timing_feasibility
  known_exceptions: []
  model_override_allowed: false
  source_cases:
  - EVAL-003
  source_references:
  - External-Incident-003
  - External-Incident-005
  confidence: EVAL_LOCKED
  status: FINAL_DRAFT
  version: 1.0.0
- rule_id: CAPACITY-RULE-001
  rule_class: CAPACITY
  stage: GLOBAL_OPTIMIZER
  severity: BLOCKING
  title: Partner demand and capacity are shared globally
  condition: Multiple lots/actions allocate to the same partner in one request.
  decision: Sum of selected allocations to the partner must not exceed active demand or available capacity.
  required_data:
  - partner_shared_capacity
  - active_demand_quantity
  - global_allocation_quantity
  - marginal_gain_vs_fallback
  known_exceptions: []
  model_override_allowed: false
  source_cases:
  - EVAL-004
  source_references:
  - External-Incident-005
  - External-Incident-006
  confidence: EVAL_LOCKED
  status: FINAL_DRAFT
  version: 1.0.0
- rule_id: SAFETY-RULE-001
  rule_class: SAFETY
  stage: SAFETY_GATE
  severity: HARD_REJECT
  title: Primary barrier failure blocks consumption channels
  condition: Leak, bulge, open seal, severe seam rust, contamination, or equivalent safety-critical defect is present.
  decision: Mark HARD_REJECT and block every human-consumption action; only verified recall/non-consumption or safe disposal
    may remain.
  required_data:
  - defect_severity
  - primary_barrier_integrity
  - seal_integrity
  - hard_reject_reason
  known_exceptions:
  - Confirmed supplier recall or non-consumption return flow.
  model_override_allowed: false
  source_cases:
  - EVAL-005
  source_references:
  - Incident-010
  confidence: EVAL_LOCKED
  status: FINAL_DRAFT
  version: 1.0.0
- rule_id: TIMING-RULE-002
  rule_class: TIMING
  stage: FEASIBILITY_GATE
  severity: CONSTRAINT
  title: Commercial seasonality window is separate from expiry
  condition: A product has a seasonal demand/value window.
  decision: Evaluate commercial urgency independently from safety expiry; expiry-valid stock may still require faster markdown/bundle
    action.
  required_data:
  - seasonality_status
  - remaining_commercial_window_days
  - remaining_shelf_life_days
  - post_season_discount
  known_exceptions: []
  model_override_allowed: false
  source_cases:
  - EVAL-006
  source_references:
  - Incident-015
  confidence: EVAL_LOCKED
  status: FINAL_DRAFT
  version: 1.0.0
- rule_id: RETURN-RULE-001
  rule_class: RETURN
  stage: FEASIBILITY_GATE
  severity: BLOCKING
  title: Supplier return requires verified policy and net value
  condition: RETURN_TO_SUPPLIER is proposed.
  decision: Allow only within confirmed policy, purpose, quantity, deadline, and after all return costs are included.
  required_data:
  - supplier_return_status
  - return_eligible_quantity
  - supplier_credit
  - return_deadline
  - return_cost
  known_exceptions:
  - Recall/non-consumption return may remain valid when commercial return is not.
  model_override_allowed: false
  source_cases:
  - EVAL-007
  source_references:
  - Incident-016
  confidence: EVAL_LOCKED
  status: FINAL_DRAFT
  version: 1.0.0
- rule_id: VALUE-RULE-001
  rule_class: VALUE
  stage: EXPECTED_VALUE
  severity: SELECTION
  title: Compare marginal net value against fallback
  condition: Two or more feasible actions compete for the same units.
  decision: Select based on net marginal value for the same units after action-specific cost, subject to objective and constraints.
  required_data:
  - return_net_recovery
  - fallback_net_recovery
  - marginal_gain
  - return_eligible_quantity
  known_exceptions:
  - MINIMIZE_WASTE or BALANCED may choose lower cash value when objective policy explicitly requires it.
  model_override_allowed: false
  source_cases:
  - EVAL-008
  source_references:
  - Incident-016
  confidence: EVAL_LOCKED
  status: FINAL_DRAFT
  version: 1.0.0
- rule_id: VALUE-RULE-002
  rule_class: VALUE
  stage: EXPECTED_VALUE
  severity: CONSTRAINT
  title: Internal use is avoided purchase cost, not cash revenue
  condition: INTERNAL_USE is proposed.
  decision: Allocation cannot exceed verified internal need; report value as avoided purchase cost and cash recovery as zero.
  required_data:
  - verified_internal_need
  - replacement_cost
  - avoided_purchase_cost
  - cash_recovery_type
  known_exceptions: []
  model_override_allowed: false
