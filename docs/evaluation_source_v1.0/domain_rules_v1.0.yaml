  stage: SAFETY_FEASIBILITY_GATE
  severity: BLOCKING
  title: Donation requires verified need, capacity, handling, and timely completion
  condition: DONATION is proposed.
  decision: Require acceptable quality, verified recipient, active need/capacity, category/storage/handling match, and completion
    before safe deadline.
  required_data:
