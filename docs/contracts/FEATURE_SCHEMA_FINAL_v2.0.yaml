versioning_policy:
  breaking_change: increment major version
  new optional field or enum value: increment minor version
  documentation-only correction: increment patch version
  artifact_rule: model, ruleset, schema, capability snapshot, and partner registry must each carry version or hash metadata
validation_debt:
- TRIAGE-001 through TRIAGE-008 are locked and validate deterministic triage routing.
- INTEGRATION-001 is locked and validates raw inventory through expected Rescue Decision Report.
- Malformed-input acceptance cases remain documented validation debt for production tests.
- Category-specific required-field policies remain configurable and must be finalized during implementation without weakening conservative routing.
- Real capability, partner demand, model probability, and report usability remain field-validation debt and are not claimed by this schema.
