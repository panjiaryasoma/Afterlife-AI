model_feature_contract:
  row_granularity: one feasible candidate action for one surplus planning lot in one synthetic scenario
  canonical_target: simulated_rescue_outcome
  target_type: binary integer {0,1}
  deprecated_target_alias: simulated_rescue_success
  latent_generator_field: generator_success_probability
  inference_output: estimated_rescue_success_score
  acceptance_fixture_score: fixture_rescue_success_score
  group_split_fields:
  - scenario_group_id
  - business_profile_id
  allowed_categorical_features:
  - product_category
  - product_subcategory
  - action_type
  - business_type
  - storage_requirement_mode
