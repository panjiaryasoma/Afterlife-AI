schema_name: Afterlife AI Executable Data and Feature Contract
version: 2.0.0
status: LOCKED_FOR_PREPRODUCTION_FINAL
effective_date: '2026-08-05'
scope:
- single-file inventory intake
- deterministic inventory triage
- capability-aware rescue candidate generation
- deterministic safety, coverage, verification, and feasibility gates
- single rescue-success scoring model
- global batch allocation optimization
- rescue decision report and human approval state
claim_boundary: All rescue-success labels and probabilities are synthetic or fixture-based until validated with real operational outcomes. The schema must not be used to imply real-world probability validation.
source_of_truth_order:
- PROBLEM_BRIEF_v1.0.md
- SIMPLE_PRD_v1.1_UPDATED.md
- SIMPLE_PRD_SCHEMA_ALIGNMENT_ADDENDUM_v1.0.md
- FEATURE_SCHEMA_FINAL_v2.0.yaml
- domain_rules_v1.0.yaml
- evaluation_spec_v1.0.yaml
- TRIAGE_EVALUATION_SUITE_v1.0.md
- INTEGRATION-001.md
canonical_runtime_contract:
  request_mode: ONE_SYNCHRONOUS_REQUEST
  canonical_input_format: XLSX
  canonical_input_sheet: inventory_lots
  one_input_row_semantics: one traceable physical lot or batch; mixed expiry or mixed age must not be merged
  ai_model_count: 1
  database_required: false
  runtime_internet_required: false
  execution_required: false
  human_final_approval_required: true
enums:
  ValidationStatus:
  - PASSED
  - FAILED
  - PARTIAL
  InventoryStatus:
  - HEALTHY_STOCK
  - MONITOR
  - SURPLUS_CANDIDATE
  - EXPIRED
  - NEEDS_REVIEW
  SurplusSource:
  - CALCULATED
  - USER_DECLARED
  - RULE_TRIGGERED
  TriageConfidenceStatus:
  - HIGH
  - MEDIUM
  - LOW
  - NOT_APPLICABLE
  VerificationStatus:
  - LOW
  - PARTIALLY_VERIFIED
  - VERIFIED
  - PHYSICALLY_INSPECTED
  CoverageStatus:
  - SUPPORTED
  - UNSUPPORTED
  - INSUFFICIENT_FEATURE_COVERAGE
  SafetyStatus:
  - ACCEPTABLE
  - ACCEPTABLE_WITH_URGENCY
  - UNVERIFIED
  - HARD_REJECT
  FeasibilityStatus:
  - FEASIBLE
  - INFEASIBLE
  - NEEDS_REVIEW
  - UNSUPPORTED
  ModelScoringStatus:
  - ALLOWED
  - SKIPPED
  - DEFERRED
  - BLOCKED
  OptimizationObjective:
  - MAXIMIZE_RECOVERY_VALUE
  - MINIMIZE_WASTE
  - BALANCED
  ActionType:
  - LOCAL_DISCOUNT
  - BUNDLE
  - PROMOTIONAL_BONUS
  - INTERNAL_REPURPOSE
  - INTERNAL_USE
  - RETURN_TO_SUPPLIER
  - BRANCH_TRANSFER
  - WHOLESALE
  - EXTERNAL_PARTNER
  - DONATION
  - SAFE_DISPOSAL
  StorageType:
  - DRY_AMBIENT
  - ROOM_TEMPERATURE
  - CHILLED
  - FROZEN
  - UNKNOWN
  StorageRequirementMode:
  - NONE
  - AMBIENT_ALLOWED
  - CHILLED_PREFERRED
  - COLD_REQUIRED_FOR_QUALITY_WINDOW
  - SAFETY_CRITICAL_COLD_CHAIN
  StorageHistoryStatus:
  - VERIFIED_ACCEPTABLE
  - VERIFIED_FAILURE
  - UNKNOWN
  - UNRESOLVED
  - NOT_APPLICABLE
  ProductCondition:
  - GOOD
  - VISUALLY_NORMAL
  - COSMETIC_DEFECT
  - AMBIGUOUS
  - DAMAGED
  - UNKNOWN
  PackagingCondition:
  - INTACT
  - COSMETIC_LABEL_DAMAGE
  - AMBIGUOUS_DAMAGE
  - PRIMARY_BARRIER_DAMAGED
  - LEAKING
  - OPEN_SEAL
  - UNKNOWN
  - NOT_APPLICABLE
  DefectSeverity:
  - NONE
  - COSMETIC_ONLY
  - MANUAL_REVIEW
  - SAFETY_CRITICAL
  QualityInspectionStatus:
  - PASSED
  - FAILED
  - NOT_PERFORMED
  - NOT_APPLICABLE
  UrgencyLevel:
  - LOW
  - MEDIUM
  - HIGH
  - CRITICAL
  SeasonalityStatus:
  - IN_SEASON
  - POST_SEASON
  - PRE_SEASON
  - NOT_APPLICABLE
  - UNKNOWN
  RegistryStatus:
  - ACTIVE
  - STALE
  - EXPIRED
  - SUSPENDED
  - UNVERIFIED
  DemandStatus:
  - ACTIVE
  - ZERO
  - STALE
  - EXPIRED
  - UNKNOWN
  MatchStatus:
  - MATCH
  - MISMATCH
  - UNKNOWN
  - NOT_APPLICABLE
  ApprovalStatus:
  - PENDING
  - APPROVED
  - ADJUSTED
  - REJECTED
  SolverStatus:
  - OPTIMAL
  - FEASIBLE
  - INFEASIBLE
  - MODEL_INVALID
  - UNKNOWN
  - FALLBACK_USED
  UnitCode:
  - UNIT
  - PIECE
  - PACK
  - SACHET
  - BOTTLE
  - CAN
  - CUP
  - BOX
  - TRAY
  - KG
  - GRAM
  - LITER
  - ML
  - OTHER
  BusinessType:
  - SMALL_RETAIL
  - MEDIUM_RETAIL
  - SMALL_FNB
  - MEDIUM_FNB
  - MEDIUM_WHOLESALER
  ProductCategory:
  - PACKAGED_FOOD
  - PACKAGED_BEVERAGE
  - BAKERY
  - READY_TO_EAT_MEAL
  - FROZEN_PREPARED_FOOD
  - CHILLED_DAIRY
  - FRESH_PRODUCE
  - HOUSEHOLD_CLEANING
  - PERSONAL_CARE
  - CONDIMENT
  - BABY_CARE
  - CHOCOLATE
  - OTHER_SUPPORTED
  SourceType:
  - SYNTHETIC_GENERATED
  - EVALUATION_FIXTURE
  - USER_INPUT
  - STATIC_REGISTRY
  - STATIC_POLICY
  IntegrityStatus:
  - INTACT
  - COMPROMISED
  - UNKNOWN
  - NOT_APPLICABLE
entities:
  ANALYSIS_REQUEST:
    description: Dynamic request context submitted together with the inventory file.
    fields:
      request_id:
        type: string
        required: false
        source: SYSTEM_GENERATED
        pattern: ^[A-Za-z0-9_-]+$
      analysis_timestamp:
        type: datetime
        required: false
        source: SYSTEM_GENERATED
      inventory_file_name:
        type: string
        required: true
        source: USER_INPUT
      optimization_objective:
        type: OptimizationObjective
        required: true
        source: USER_INPUT
      max_logistics_budget:
        type: decimal
        required: false
        source: USER_INPUT
        minimum: 0
        currency: IDR
      rescue_deadline_at:
        type: datetime
        required: false
        source: USER_INPUT
      minimum_expected_rescue_ratio:
        type: decimal
        required: false
        source: USER_INPUT_OR_STATIC_DEFAULT
        minimum: 0
        maximum: 1
        required_when: optimization_objective == BALANCED
      objective_policy_version:
        type: string
        required: true
        source: STATIC_POLICY
      random_seed:
        type: integer
        required: true
        source: STATIC_POLICY
        default: 42
  INVENTORY_LOT:
    description: One raw inventory row. A row is not assumed to be surplus.
    fields:
      lot_id:
        type: string
        required: true
        source: USER_INPUT
        unique_within_request: true
      sku:
        type: string
        required: true
        source: USER_INPUT
      batch_or_reference_id:
        type: string
        required: false
        source: USER_INPUT
      product_name:
        type: string
        required: true
        source: USER_INPUT
      product_category:
        type: ProductCategory
        required: true
        source: USER_INPUT
      product_subcategory:
        type: string
        required: false
        source: USER_INPUT
      current_quantity:
        type: decimal
        required: true
        source: USER_INPUT
        minimum: 0
      unit:
        type: UnitCode
        required: true
        source: USER_INPUT
      unit_cost:
        type: decimal
        required: true
        source: USER_INPUT
        minimum: 0
        currency: IDR
      normal_selling_price:
        type: decimal
        required: true
        source: USER_INPUT
        minimum: 0
        currency: IDR
      minimum_recovery_price:
        type: decimal
        required: false
        source: USER_INPUT
        minimum: 0
        currency: IDR
      source_location:
        type: string
        required: true
        source: USER_INPUT
      purchase_date:
        type: date
        required: false
        source: USER_INPUT
      last_receipt_date:
        type: date
        required: false
        source: USER_INPUT
      production_date:
        type: date
        required: false
        source: USER_INPUT
      expiry_date:
        type: date
        required: false
        source: USER_INPUT
        conditional: required for expiry-managed categories
      safe_use_by_at:
        type: datetime
        required: false
        source: USER_INPUT
        conditional: required for time-sensitive ready-to-eat categories when applicable
      commercial_sale_cutoff_at:
        type: datetime
        required: false
        source: USER_INPUT
      units_sold_observation_window:
        type: decimal
        required: false
        source: USER_INPUT
        minimum: 0
      observation_days:
        type: integer
        required: false
        source: USER_INPUT
        minimum_exclusive: 0
        required_when: units_sold_observation_window is present
      safety_stock:
        type: decimal
        required: false
        source: USER_INPUT
        minimum: 0
        default: 0
      declared_surplus:
        type: boolean
        required: false
        source: USER_INPUT
        default: false
      declared_surplus_quantity:
        type: decimal
        required: false
        source: USER_INPUT
        minimum: 0
        required_when: declared_surplus == true
      storage_type:
        type: StorageType
        required: true
        source: USER_INPUT
      storage_history_status:
        type: StorageHistoryStatus
        required: false
        source: USER_INPUT
      temperature_log_available:
        type: boolean
        required: false
        source: USER_INPUT
      product_condition:
        type: ProductCondition
        required: false
        source: USER_INPUT
      packaging_condition:
        type: PackagingCondition
        required: false
        source: USER_INPUT
      quality_inspection_status:
        type: QualityInspectionStatus
        required: false
        source: USER_INPUT
      seal_integrity:
        type: IntegrityStatus
        required: false
        source: USER_INPUT
      primary_container_integrity:
        type: IntegrityStatus
        required: false
        source: USER_INPUT
      expiry_label_readable:
        type: boolean
        required: false
        source: USER_INPUT
      lot_code_readable:
        type: boolean
        required: false
        source: USER_INPUT
      package_volume_ml:
        type: decimal
        required: false
        source: USER_INPUT
        minimum: 0
      package_weight_g:
        type: decimal
        required: false
        source: USER_INPUT
        minimum: 0
      package_format:
        type: string
        required: false
        source: USER_INPUT
      verification_status:
        type: VerificationStatus
        required: true
        source: USER_INPUT
    row_constraints:
    - declared_surplus_quantity <= current_quantity
    - minimum_recovery_price <= normal_selling_price unless an explicit premium recovery policy exists
    - purchase_date <= analysis_timestamp when present
    - expiry_date must be parseable when present
    - mixed batch, mixed expiry, or mixed storage history must be split into separate rows; otherwise route to NEEDS_REVIEW
    - unknown safety-critical fields are never imputed optimistically
    - zero-quantity rows are reported and excluded from planning, not silently processed
  INVENTORY_TRIAGE_RESULT:
    description: Deterministic routing result before rescue planning.
    fields:
      source_lot_id:
        type: string
        required: true
        source: SYSTEM_DERIVED
      analysis_date:
        type: date
        required: true
        source: SYSTEM_DERIVED
      remaining_shelf_life_days:
        type: integer
        required: false
        source: SYSTEM_DERIVED
      remaining_safe_window_hours:
        type: decimal
        required: false
        source: SYSTEM_DERIVED
        minimum: 0
      remaining_commercial_window_days:
        type: decimal
        required: false
        source: SYSTEM_DERIVED
        minimum: 0
      average_daily_sales:
        type: decimal
        required: false
        source: SYSTEM_DERIVED
        minimum: 0
      effective_sales_window_days:
        type: decimal
        required: false
        source: SYSTEM_DERIVED
        minimum: 0
      expected_normal_sales:
        type: decimal
        required: false
        source: SYSTEM_DERIVED
        minimum: 0
      protected_normal_stock_quantity:
        type: decimal
        required: true
        source: SYSTEM_DERIVED
        minimum: 0
      monitor_quantity:
        type: decimal
        required: true
        source: SYSTEM_DERIVED
        minimum: 0
        default: 0
      surplus_candidate_quantity:
        type: decimal
        required: true
        source: SYSTEM_DERIVED
        minimum: 0
        default: 0
      planning_quantity:
        type: decimal
        required: true
        source: SYSTEM_DERIVED
        minimum: 0
        default: 0
        description: Only quantity eligible to emit SURPLUS_PLANNING_LOT. A positive planning quantity does not make protected, monitor, expired, or review quantities planner-eligible.
      expired_quantity:
        type: decimal
        required: true
        source: SYSTEM_DERIVED
        minimum: 0
        default: 0
      review_quantity:
        type: decimal
        required: true
        source: SYSTEM_DERIVED
        minimum: 0
        default: 0
        description: Quantity held outside rescue planning because evidence remains unresolved. May be positive for a fully review-routed NEEDS_REVIEW lot or for the unresolved remainder of a mixed-routing SURPLUS_CANDIDATE lot.
      inventory_status:
        type: InventoryStatus
        required: true
        source: SYSTEM_DERIVED
      surplus_source:
        type: SurplusSource
        required: false
        source: SYSTEM_DERIVED
      triage_reason_codes:
        type: list[string]
        required: true
        source: SYSTEM_DERIVED
      triage_confidence_status:
        type: TriageConfidenceStatus
        required: true
        source: SYSTEM_DERIVED
      urgency_level:
        type: UrgencyLevel
        required: true
        source: SYSTEM_DERIVED
      estimated_current_value:
        type: decimal
        required: true
        source: SYSTEM_DERIVED
        minimum: 0
        currency: IDR
      triage_policy_version:
        type: string
        required: true
        source: STATIC_POLICY
    derivations:
      average_daily_sales: units_sold_observation_window / observation_days
      expected_normal_sales: average_daily_sales * effective_sales_window_days
      protected_normal_stock_quantity: min(current_quantity, expected_normal_sales + safety_stock)
      surplus_candidate_quantity: max(0, current_quantity - protected_normal_stock_quantity)
      planning_quantity_user_declared: declared_surplus_quantity when valid
      planning_quantity_calculated: surplus_candidate_quantity when calculation is supported
    invariants:
    - protected_normal_stock_quantity + monitor_quantity + planning_quantity + expired_quantity + review_quantity == current_quantity
    - planning_quantity > 0 only when inventory_status == SURPLUS_CANDIDATE
    - expired_quantity > 0 only when inventory_status == EXPIRED
    - review_quantity > 0 only when inventory_status in {NEEDS_REVIEW, SURPLUS_CANDIDATE}
    - when inventory_status == SURPLUS_CANDIDATE and review_quantity > 0, only planning_quantity may emit SURPLUS_PLANNING_LOT; review_quantity remains review-pending
    - model scoring is forbidden for HEALTHY_STOCK, MONITOR, EXPIRED, and NEEDS_REVIEW
  SURPLUS_PLANNING_LOT:
    description: Internal lot snapshot emitted only for SURPLUS_CANDIDATE planning quantity.
    fields:
      planning_lot_id:
        type: string
        required: true
        source: SYSTEM_DERIVED
        unique_within_request: true
      source_lot_id:
        type: string
        required: true
        source: SYSTEM_DERIVED
      sku:
        type: string
        required: true
        source: COPIED_FROM_INVENTORY_LOT
      product_name:
        type: string
        required: true
        source: COPIED_FROM_INVENTORY_LOT
      product_category:
        type: ProductCategory
        required: true
        source: COPIED_FROM_INVENTORY_LOT
      product_subcategory:
        type: string
        required: false
        source: COPIED_FROM_INVENTORY_LOT
      planning_quantity:
        type: decimal
        required: true
        source: COPIED_FROM_TRIAGE_RESULT
        minimum_exclusive: 0
      unit:
        type: UnitCode
        required: true
        source: COPIED_FROM_INVENTORY_LOT
      unit_cost:
        type: decimal
        required: true
        source: COPIED_FROM_INVENTORY_LOT
        minimum: 0
        currency: IDR
      normal_selling_price:
        type: decimal
        required: true
        source: COPIED_FROM_INVENTORY_LOT
        minimum: 0
        currency: IDR
      minimum_recovery_price:
        type: decimal
        required: false
        source: COPIED_FROM_INVENTORY_LOT
        minimum: 0
        currency: IDR
      source_location:
        type: string
        required: true
        source: COPIED_FROM_INVENTORY_LOT
      remaining_shelf_life_days:
        type: integer
        required: false
        source: COPIED_FROM_TRIAGE_RESULT
      remaining_safe_window_hours:
        type: decimal
        required: false
        source: COPIED_FROM_TRIAGE_RESULT
        minimum: 0
      remaining_commercial_window_days:
        type: decimal
        required: false
        source: COPIED_FROM_TRIAGE_RESULT
        minimum: 0
      urgency_level:
        type: UrgencyLevel
        required: true
        source: COPIED_FROM_TRIAGE_RESULT
      surplus_source:
        type: SurplusSource
        required: true
        source: COPIED_FROM_TRIAGE_RESULT
      seasonality_status:
        type: SeasonalityStatus
        required: false
        source: SYSTEM_DERIVED
      storage_type:
        type: StorageType
        required: true
        source: COPIED_FROM_INVENTORY_LOT
      storage_requirement_mode:
        type: StorageRequirementMode
        required: true
        source: DOMAIN_RULE_DERIVED
      storage_history_status:
        type: StorageHistoryStatus
        required: false
        source: COPIED_FROM_INVENTORY_LOT
      product_condition:
        type: ProductCondition
        required: false
        source: COPIED_FROM_INVENTORY_LOT
      packaging_condition:
        type: PackagingCondition
        required: false
        source: COPIED_FROM_INVENTORY_LOT
      defect_severity:
        type: DefectSeverity
        required: true
        source: DOMAIN_RULE_DERIVED
      quality_inspection_status:
        type: QualityInspectionStatus
        required: false
        source: COPIED_FROM_INVENTORY_LOT
      verification_status:
        type: VerificationStatus
        required: true
        source: COPIED_FROM_INVENTORY_LOT
      package_volume_ml:
        type: decimal
        required: false
        source: COPIED_FROM_INVENTORY_LOT
        minimum: 0
      package_weight_g:
        type: decimal
        required: false
        source: COPIED_FROM_INVENTORY_LOT
        minimum: 0
      package_format:
        type: string
        required: false
        source: COPIED_FROM_INVENTORY_LOT
      estimated_current_value:
        type: decimal
        required: true
        source: COPIED_FROM_TRIAGE_RESULT
        minimum: 0
        currency: IDR
  BUSINESS_CAPABILITY_PROFILE:
    description: Static internal snapshot describing what the source business can actually execute.
    fields:
      business_id:
        type: string
        required: true
        source: STATIC_ARTIFACT
      business_type:
        type: BusinessType
        required: true
        source: STATIC_ARTIFACT
      snapshot_version:
        type: string
        required: true
        source: STATIC_ARTIFACT
      snapshot_timestamp:
        type: datetime
        required: true
        source: STATIC_ARTIFACT
      source_locations:
        type: list[string]
        required: true
        source: STATIC_ARTIFACT
      enabled_actions:
        type: list[ActionType]
        required: true
        source: STATIC_ARTIFACT
      resource_capacities:
        type: map[string,decimal]
        required: true
        source: STATIC_ARTIFACT
        examples:
        - labor_hours
        - equipment_units
        - ingredient_units
        - bundle_companion_units
        - cold_storage_units
      verified_internal_needs:
        type: map[string,decimal]
        required: true
        source: STATIC_ARTIFACT
      branch_destinations:
        type: list[object]
        required: true
        source: STATIC_ARTIFACT
      supplier_return_policies:
        type: list[object]
        required: true
        source: STATIC_ARTIFACT
      logistics_modes:
        type: list[object]
        required: true
        source: STATIC_ARTIFACT
      default_action_costs:
        type: map[ActionType,object]
        required: true
        source: STATIC_ARTIFACT
  PARTNER_DEMAND_ENTRY:
    description: One verified partner-category demand snapshot. Registry is closed and static during a request.
    fields:
      partner_entry_id:
        type: string
        required: true
        source: STATIC_ARTIFACT
        unique: true
      partner_id:
        type: string
        required: true
        source: STATIC_ARTIFACT
      partner_name:
        type: string
        required: true
        source: STATIC_ARTIFACT
      partner_type:
        type: string
        required: true
        source: STATIC_ARTIFACT
      registry_status:
        type: RegistryStatus
        required: true
        source: STATIC_ARTIFACT
      verification_status:
        type: VerificationStatus
        required: true
        source: STATIC_ARTIFACT
      valid_from:
        type: datetime
        required: true
        source: STATIC_ARTIFACT
      valid_until:
        type: datetime
        required: true
        source: STATIC_ARTIFACT
      accepted_categories:
        type: list[ProductCategory]
        required: true
        source: STATIC_ARTIFACT
      accepted_subcategories:
        type: list[string]
        required: true
        source: STATIC_ARTIFACT
      accepted_package_formats:
        type: list[string]
        required: true
        source: STATIC_ARTIFACT
      minimum_package_volume_ml:
        type: decimal
        required: false
        source: STATIC_ARTIFACT
        minimum: 0
      maximum_package_volume_ml:
        type: decimal
        required: false
        source: STATIC_ARTIFACT
        minimum: 0
      customer_segment:
        type: string
        required: false
        source: STATIC_ARTIFACT
      demand_status:
        type: DemandStatus
        required: true
        source: STATIC_ARTIFACT
      active_demand_quantity:
        type: decimal
        required: true
        source: STATIC_ARTIFACT
        minimum: 0
      available_capacity:
        type: decimal
        required: true
        source: STATIC_ARTIFACT
        minimum: 0
      minimum_order_quantity:
        type: decimal
        required: false
        source: STATIC_ARTIFACT
        minimum: 0
      offered_price_per_unit:
        type: decimal
        required: false
        source: STATIC_ARTIFACT
        minimum: 0
        currency: IDR
      accepted_storage_types:
        type: list[StorageType]
        required: true
        source: STATIC_ARTIFACT
      minimum_remaining_shelf_life_days:
        type: integer
        required: false
        source: STATIC_ARTIFACT
        minimum: 0
      pickup_available:
        type: boolean
        required: true
        source: STATIC_ARTIFACT
      estimated_pickup_hours:
        type: decimal
        required: false
        source: STATIC_ARTIFACT
        minimum: 0
      estimated_distribution_hours:
        type: decimal
        required: false
        source: STATIC_ARTIFACT
        minimum: 0
      destination_location:
        type: string
        required: true
        source: STATIC_ARTIFACT
      estimated_distance_km:
        type: decimal
        required: false
        source: STATIC_ARTIFACT
        minimum: 0
      logistics_cost:
        type: decimal
        required: false
        source: STATIC_ARTIFACT
        minimum: 0
        currency: IDR
    invariants:
    - valid_from <= valid_until
    - allocatable quantity <= min(active_demand_quantity, available_capacity)
    - STALE, EXPIRED, SUSPENDED, or UNVERIFIED entries cannot be automatically allocated
  DOMAIN_ACTION_RULE:
    description: Static rule-pack entry defining action eligibility, required evidence, and fallback behavior.
    fields:
      rule_id:
        type: string
        required: true
        source: STATIC_ARTIFACT
        unique: true
      rule_version:
        type: string
        required: true
        source: STATIC_ARTIFACT
      action_type:
        type: ActionType
        required: false
        source: STATIC_ARTIFACT
      stage:
        type: string
        required: true
        source: STATIC_ARTIFACT
      severity:
        type: string
        required: true
        source: STATIC_ARTIFACT
      required_fields:
        type: list[string]
        required: true
        source: STATIC_ARTIFACT
      condition_expression:
        type: string
        required: true
        source: STATIC_ARTIFACT
      decision_expression:
        type: string
        required: true
