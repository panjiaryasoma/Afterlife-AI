  - source_type
  claim_boundary: The output is calibrated only to the synthetic generation and evaluation process.
cross_entity_invariants:
- Every source lot appears exactly once in INVENTORY_TRIAGE_RESULT.
- Only SURPLUS_CANDIDATE with planning_quantity > 0 can emit SURPLUS_PLANNING_LOT.
- Every CANDIDATE_ACTION references an existing SURPLUS_PLANNING_LOT.
- Infeasible, unsupported, hard-reject, expired, or review-pending candidates receive no model score.
- Sum of allocations plus fallback and unallocated quantity equals planning_quantity for each planning lot.
- Partner allocations across all lots do not exceed active demand or available capacity.
- Global logistics cost does not exceed max_logistics_budget when provided.
- Global cold-storage use does not exceed available capacity after reservations.
- The optimization objective never overrides validation, coverage, safety, verification, or feasibility rules.
- The report separates cash recovery, future branch recovery, avoided purchase cost, physical rescue, waste, inventory loss, and social allocation.
- Human approval changes approval state only; it does not execute any real-world action.
- review_quantity never emits SURPLUS_PLANNING_LOT and never enters candidate generation, model scoring, or allocation.
- For mixed-routing SURPLUS_CANDIDATE lots, planning_quantity and review_quantity remain disjoint and their downstream routes must be independently traceable.
- fixture_rescue_success_score may be populated only for evaluation fixtures and does not imply that a trained model was executed.
