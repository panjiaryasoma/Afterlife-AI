[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"


[project]
name = "afterlife-ai"
version = "0.1.0"
description = "Local-first AI-assisted rescue inventory planning for retail and F&B surplus."
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "python-multipart",
    "jinja2",
    "numpy>=2.4,<2.5",
    "pandas",
    "openpyxl",
    "PyYAML",
    "scikit-learn",
    "joblib",
    "ortools",
    "matplotlib",
    "streamlit>=1.61.1",
]


[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "httpx",
    "ruff",
    "mypy",
    "httpx2>=2.10.0",
]


[tool.setuptools]
package-dir = { "" = "src" }


[tool.setuptools.packages.find]
where = ["src"]
include = ["afterlife_ai*"]


[tool.setuptools.package-data]
afterlife_ai = ["evaluation/planner_cases/*.yaml"]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src", "."]


[tool.coverage.run]
branch = true
source = ["afterlife_ai"]


[tool.coverage.report]
show_missing = true
skip_covered = true


[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]


[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]


[tool.ruff.lint.isort]
known-first-party = ["afterlife_ai"]


[tool.mypy]
python_version = "3.12"
mypy_path = "src"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
ignore_missing_imports = true
